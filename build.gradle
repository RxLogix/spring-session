buildscript {
    ext {
        grailsVersion = project.grailsVersion
    }
    repositories {
        mavenLocal()
        maven { url "https://repo.grails.org/grails/core" }
    }
    dependencies {
        classpath "org.grails:grails-gradle-plugin:$grailsVersion"
    }
}

version "2.0.0-RC3-beta1"
group "org.grails.plugins"

apply plugin: "eclipse"
apply plugin: "idea"
apply plugin: "org.grails.grails-plugin"
apply plugin: "org.grails.grails-plugin-publish"

ext {
    grailsVersion = project.grailsVersion
    gradleWrapperVersion = project.gradleWrapperVersion
}

repositories {
    mavenLocal()
    maven { url "https://repo.grails.org/grails/repo" }
    maven { url "https://repo.grails.org/grails/core" }
    maven { url "https://repo1.maven.org/maven2/" }
    maven { url "https://build.shibboleth.net/nexus/content/repositories/releases" }
    maven { url "https://build.shibboleth.net/nexus/content/groups/public/" }
    maven { url "https://code.lds.org/nexus/content/groups/main-repo" }
    maven { url "https://repository.jboss.org/maven2/" }
    maven { url "http://jasperreports.sourceforge.net/maven2" }
    maven { url "http://10.100.3.6:8080/nexus/content/repositories/common-component-snapshots" }
    maven { url "http://10.100.3.6:8080/nexus/content/repositories/thirdparty" }
}

dependencyManagement {
    imports {
        mavenBom "org.grails:grails-bom:$grailsVersion"
    }
    applyMavenExclusions false
}

dependencies {
    compile "org.springframework.boot:spring-boot-starter-logging"
    compile "org.springframework.boot:spring-boot-autoconfigure"
    compile "org.springframework.boot:spring-boot-starter-actuator"
    compile "org.springframework.boot:spring-boot-starter-tomcat"

    compile "org.grails:grails-core"
    compile "org.grails:grails-dependencies"
    compile "org.grails:grails-web-boot"

    console "org.grails:grails-console"

    testCompile "org.grails:grails-plugin-testing"
    testCompile "org.grails.plugins:geb"

    testRuntime 'org.seleniumhq.selenium:selenium-chrome-driver:2.44.0'

    compile('org.springframework.session:spring-session:1.3.5.RELEASE')
    compile('org.springframework.boot:spring-boot-starter-data-redis')
//    compile('redis.clients:jedis:2.5.2')
//    compile('redis.clients:jedis:2.9.0')
    testCompile "org.grails:grails-test-mixins:3.3.0"
}

task wrapper(type: Wrapper) {
    gradleVersion = gradleWrapperVersion
}
grailsPublish {
    // TODO: Provide values here
    githubSlug = 'jeetmp3/spring-session'
    license {
        name = 'Apache-2.0'
    }
    title = "Spring Session Grails Plugin"
    desc = "Provides support for SpringSession project"
    developers = [jeetmp3:"Jitendra Singh"]
    portalUser = ""
    portalPassword = ""
}

